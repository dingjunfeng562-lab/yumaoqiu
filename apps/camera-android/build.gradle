// Root build file. Plugin versions live here and are applied by the modules.
// RootEncoder 2.8.1 brings kotlin-stdlib 2.3.21, so the compiler must be at
// least that version or it cannot read the library's metadata.
plugins {
  id 'com.android.application' version '8.13.2' apply false
  id 'org.jetbrains.kotlin.android' version '2.3.21' apply false
}
