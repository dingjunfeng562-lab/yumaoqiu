plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'com.ayumaoqiu.camera'
  compileSdk 35

  defaultConfig {
    applicationId 'com.ayumaoqiu.camera'
    minSdk 24
    targetSdk 35
    versionCode 6
    versionName '1.2.3-multicamera'
  }

  buildTypes {
    debug {
      minifyEnabled false
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  buildFeatures {
    viewBinding false
  }

  packaging {
    resources.excludes += ['META-INF/*.kotlin_module']
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'androidx.appcompat:appcompat:1.7.1'
  implementation 'androidx.activity:activity-ktx:1.9.3'
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  // Camera capture + RTMP/SRT publishing. Published through JitPack only.
  implementation 'com.github.pedroSG94.RootEncoder:library:2.8.1'
  // Scans the pairing QR code shown in the admin page.
  implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
  implementation 'io.livekit:livekit-android:2.29.0'
  implementation 'androidx.camera:camera-camera2:1.4.2'
  implementation 'androidx.camera:camera-lifecycle:1.4.2'
  implementation 'androidx.lifecycle:lifecycle-service:2.8.7'

  // Pure-logic tests (zoom maths, pairing payload, config parsing). JSON parsing
  // uses org.json, which is only stubbed in android.jar, so the real one is added.
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20250517'
  // Match LiveKit's runtime dependency so regression tests exercise its real
  // permission protobuf serializer (including the nullable-identifier failure).
  testImplementation 'com.google.protobuf:protobuf-javalite:3.25.9'
}
